[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "Stateless Streamable HTTP MCP service exposing the Go Pet Hospital REST API to AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pet Hospital MCP Teaching" }]
license = { text = "MIT" }
dependencies = [
    # MCP 官方 Python SDK 2.x(2026-07-28 协议);禁止使用 mcp.server.fastmcp.FastMCP
    "mcp==2.0.0",
    # HTTP 客户端:调用上游 Go REST API
    "httpx>=0.27",
    # 数据模型与输入校验
    "pydantic>=2.7",
    # ASGI 服务器(运行 Starlette app)
    "uvicorn>=0.30",
    # 结构化日志
    "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
